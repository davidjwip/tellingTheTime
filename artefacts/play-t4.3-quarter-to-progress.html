<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarter to, four read</title>
<style>
/* Parity tokens and layout, copied from simpleKindergartenAdditionWebpage/src/style.css.
   Classes keep the reference's names so the two apps stay recognisably the same object.
   See specs/design-parity.md. The only new classes are the clock frame, the verdict pad,
   the prompt line and the setup shelf — all listed in §7 of that document. */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
  background: linear-gradient(135deg, #ffd1dc, #a2d8f1);
  color: #333;
  min-height: 100vh;
  margin: 0;
  padding: 10px;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  background-color: rgba(255, 255, 255, 0.9);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  padding: 15px;
  text-align: center;
}

header {
  margin-bottom: 10px;
}

h1 {
  color: #ff6b6b;
  font-size: 2.5rem;
  text-shadow: 2px 2px 0 #ffd1dc;
  margin-bottom: 10px;
}

.instructions {
  color: #4ecdc4;
  font-size: 1.2rem;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}

.action-btn {
  border: none;
  border-radius: 50px;
  background-color: #ff6b6b;
  color: white;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  transition: all 0.3s ease;
  font-family: inherit;
  font-size: 1rem;
  padding: 12px 20px;
}

.action-btn.small {
  padding: 8px 16px;
  font-size: 0.9rem;
  /* 44px is the smallest thing a thumb should have to hit, and this row is full of them. */
  min-height: 44px;
}

.action-btn:hover {
  background-color: #ff5252;
  transform: scale(1.05);
}

.operator-toggle {
  display: inline-flex;
  gap: 4px;
}

/* Three registers now, so only the outer edges are rounded. */
.operator-toggle .action-btn {
  border-radius: 0;
}

.operator-toggle .action-btn:first-child {
  border-radius: 8px 0 0 8px;
}

.operator-toggle .action-btn:last-child {
  border-radius: 0 8px 8px 0;
}

/* The chosen language is green; the other is neutral. Red means "the answer was wrong" in this
   app, and no language is wrong - the base .action-btn is red, so both states are set explicitly. */
.operator-toggle .action-btn {
  background-color: #eef1f6;
  color: #2d3561;
  box-shadow: none;
}

.operator-toggle .action-btn:hover {
  background-color: #dfe4ee;
  transform: none;
}

.operator-toggle .action-btn.operator-active,
.operator-toggle .action-btn.operator-active:hover {
  /* green, because the chosen language is the right one; soft, because Start is the one solid
     green on this screen and a child should not have to guess which green to press */
  background-color: #d3f2ee;
  color: #1f6f66;
  box-shadow: inset 0 0 0 2px #4ecdc4;
}

.action-btn.primary {
  background-color: #4ecdc4;
}

/* The grown-up controls sit on one line, so they must carry the same weight: Instructions is a
   setting, not the thing to press. Grey, like the unchosen language beside it. */
.picker .header-actions .action-btn[data-action='instructions'] {
  background-color: #eef1f6;
  color: #2d3561;
  box-shadow: none;
}

.picker .header-actions .action-btn[data-action='instructions']:hover {
  background-color: #dfe4ee;
  transform: none;
}

.action-btn.primary:hover {
  background-color: #3aa897;
}

/* A tier is one button; its exercises appear in a bubble on a long press, because a title
   attribute never opens on a touch screen. */
.tier-entry {
  position: relative;
}

.tier-entry[data-tip="true"]::after {
  content: attr(data-exercises);
  position: absolute;
  left: 6px;
  right: 6px;
  top: calc(100% + 8px);
  z-index: 6;
  background-color: #2d3561;
  color: white;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 0.8rem;
  line-height: 1.35;
  text-align: left;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
}

/* The outer element is the dimming layer and covers the screen; the card sits inside it. */
.instructions-panel {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background-color: rgba(45, 53, 97, 0.45);
  z-index: 20;
}

.instructions-card {
  width: min(34rem, 100%);
  max-height: 82vh;
  overflow-y: auto;
  background-color: white;
  color: #2d3561;
  border-radius: 18px;
  padding: 22px 24px;
  text-align: left;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
}

.instructions-card h2 {
  margin-top: 0;
}

.instructions-panel .tier-list li {
  margin-bottom: 8px;
}

.mute-btn {
  background-color: #4ecdc4;
}

.mute-btn:hover {
  background-color: #3aa897;
}

main {
  margin-bottom: 15px;
}

.problem-area {
  background-color: #fff;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  margin-bottom: 15px;
}

.prompt {
  font-size: 1.3rem;
  font-weight: 600;
  color: #4ecdc4;
  margin-bottom: 10px;
}

/* The reference's answer box, scaled up: cream face, 3px teal border. */
.clock-frame {
  width: min(320px, 68vw);
  aspect-ratio: 1;
  margin: 0 auto;
  background: #fff9c4;
  border: 3px solid #4ecdc4;
  border-radius: 10px;
  padding: 10px;
}

.clock-face {
  width: 100%;
  height: 100%;
  display: block;
}

/* The pre-clock choose screens: the emoji is the picture, the word underneath is the reading. */
.choice-cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin: 10px 0;
}

.choice-card {
  min-width: 120px;
  min-height: 120px;
  padding: 15px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #fff9c4;
  border: 3px solid #4ecdc4;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
}

.choice-card:hover,
.choice-card:focus-visible {
  background: #fff3a3;
  outline: 3px solid #ff6b6b;
  outline-offset: 2px;
}

.choice-emoji {
  font-size: 2.8rem;
  line-height: 1;
}

.choice-word {
  font-size: 1.1rem;
  font-weight: 600;
  color: #333;
}

/* The order screens: shuffled cards in a pool above the row of slots they are tapped into. */
.order-pool,
.order-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 10px 0;
}

.order-row {
  min-height: 110px;
  padding: 10px;
  background: #f8f9fa;
  border-radius: 15px;
}

.order-slot {
  min-width: 90px;
  min-height: 100px;
  border: 3px dashed #4ecdc4;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.order-slot:has(.order-card) {
  border-style: solid;
}

.order-card {
  min-width: 80px;
  min-height: 90px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: #fff9c4;
  border: 3px solid #4ecdc4;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
}

.order-card:hover,
.order-card:focus-visible {
  background: #fff3a3;
  outline: 3px solid #ff6b6b;
  outline-offset: 2px;
}

.order-number {
  font-size: 2.2rem;
  font-weight: bold;
  line-height: 1;
  color: #ff6b6b;
}

.order-emoji {
  font-size: 2.4rem;
  line-height: 1;
}

.order-word {
  font-size: 1rem;
  font-weight: 600;
  color: #333;
}

.feedback-area {
  margin: 10px 0;
}

#feedback {
  font-size: 1.5rem;
  font-weight: bold;
  min-height: 40px;
  margin-bottom: 10px;
}

.pad-container {
  margin: 10px 0;
  padding: 10px;
  background-color: #f8f9fa;
  border-radius: 15px;
}

.pad {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 500px;
  margin: 0 auto;
}

.touchpad-btn {
  border: 2px solid #4ecdc4;
  border-radius: 10px;
  background-color: #fff;
  color: #333;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  font-weight: bold;
  font-size: 1.5rem;
}

.touchpad-btn:hover {
  background-color: #e0f7fa;
  transform: scale(1.05);
}

.pad-btn {
  min-height: 96px;
  font-size: 1.6rem;
}

.pad-yes {
  background-color: #4ecdc4;
  border-color: #4ecdc4;
  color: #fff;
}

.pad-yes:hover {
  background-color: #3aa897;
}

.pad-no {
  background-color: #fff;
  border-color: #4ecdc4;
  color: #333;
}

.streak-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
  padding: 10px;
  background: linear-gradient(135deg, #fff3cd, #ffe69c);
  border-radius: 15px;
}

.streak-fire {
  font-size: 2rem;
}

.streak-count {
  font-size: 1.5rem;
  font-weight: bold;
  color: #e67e22;
}

.streak-best {
  font-size: 1rem;
  color: #7f8c8d;
  margin-left: 10px;
}

.progress-area {
  background-color: #fff;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  margin-top: 10px;
}

.progress-area h2 {
  color: #ff6b6b;
  font-size: 1.5rem;
  margin-bottom: 10px;
}

.goal-track {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 10px;
  background-color: #f8f9fa;
  border-radius: 15px;
}

.goal-steps-wrapper {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.goal-steps {
  display: flex;
  justify-content: center;
  gap: 5px;
}

.step {
  width: 35px;
  height: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #e0e0e0;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: bold;
  color: #7f8c8d;
  transition: all 0.3s ease;
}

.step.filled {
  background: linear-gradient(135deg, #4ecdc4, #ff6b6b);
  color: white;
  box-shadow: 0 2px 8px rgba(78, 205, 196, 0.4);
}

.mascot {
  font-size: 2.5rem;
  flex-shrink: 0;
}

.goal-end {
  font-size: 2.5rem;
  flex-shrink: 0;
}

footer {
  margin-top: 20px;
  color: #4ecdc4;
  font-size: 1.2rem;
}

.celebration-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(0, 0, 0, 0.85);
  z-index: 9999;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
}

.celebration-overlay.visible {
  display: flex;
  animation: fadeIn 0.5s ease;
}

.celebration-title {
  font-size: 3rem;
  color: #ffd1dc;
  text-shadow: 3px 3px 0 #ff6b6b;
  margin: 20px 0;
}

.celebration-close-btn {
  margin-top: 30px;
  padding: 15px 40px;
  font-size: 1.5rem;
  border: none;
  border-radius: 50px;
  background-color: #4ecdc4;
  color: white;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
  font-family: inherit;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 768px) {
  .container { padding: 10px; }
  h1 { font-size: 2rem; }
  .clock-frame { width: min(320px, 76vw); }
}

@media (max-width: 480px) {
  h1 { font-size: 1.6rem; }
  /* The clock is the thing being touched: give it the width, not the margins. */
  .clock-frame { width: min(360px, 86vw); }
  .header-actions { gap: 6px; }
  .header-actions .action-btn.small { padding: 6px 12px; font-size: 0.85rem; }
  .step { width: 100%; max-width: 42px; aspect-ratio: 1; height: auto; font-size: 0.85rem; }
  .goal-steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; }
  .pad-btn { min-height: 80px; font-size: 1.2rem; }
  .mascot, .goal-end { font-size: 1.5rem; }
}
/* A tier is now the only control in its section, so it has to be a comfortable target for a
   four-year-old's finger: at least 44pt tall, a centred pill rather than a bar across the window,
   with the name above the count. */
.level-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: auto;
  min-width: 240px;
  max-width: 90%;
  min-height: 60px;
  padding: 14px 32px;
  border: none;
  border-radius: 50px;
  background-color: white;
  color: #2d3561;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(45, 53, 97, 0.12);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.level-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(45, 53, 97, 0.18);
}

.level-btn .level-note {
  font-size: 0.85rem;
  font-weight: 400;
  color: #6b7280;
}

.level-btn[data-cleared='true'] .level-note {
  color: #2e9e77;
}

/* The last tier would otherwise open its bubble off the bottom of the screen. */
section.tier:last-of-type .tier-entry[data-tip='true']::after {
  top: auto;
  bottom: calc(100% + 8px);
}

/* The shelf's own layout: one line of grown-up controls, the name, then a centred pill per tier. */
.picker .name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 10px 0 18px;
}

.picker .name-row label {
  font-size: 1.12rem;
  color: #2d3561;
}

.picker .name-input {
  min-height: 44px;
  width: min(14rem, 55vw);
  padding: 10px 14px;
  border: 2px solid #4ecdc4;
  border-radius: 12px;
  background-color: white;
  color: #2d3561;
  font-family: inherit;
  font-size: 1.05rem;
}

.picker .name-input:focus {
  outline: none;
  border-color: #3aa897;
  box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.3);
}

.tier {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 18px;
}

.level-grid {
  display: flex;
  justify-content: center;
  width: 100%;
}

/* Start is the one action a child presses, so it is larger than the buttons around it. */
.action-btn.start-primary {
  font-size: 1.25rem;
  padding: 16px 56px;
  margin-top: 8px;
  box-shadow: 0 8px 22px rgba(78, 205, 196, 0.55);
}

/* The dial is the control on a tap level, so it has to look like one. */
.tap-frame svg {
  cursor: pointer;
  touch-action: manipulation;
}

.tap-hint {
  margin: 6px 0 0;
  font-size: 0.95rem;
  color: #6b7280;
}

.tap-frame svg [data-numeral],
.tap-frame svg [data-minute-label] {
  fill: #2d3561;
}

.tap-frame svg [data-done='true'] {
  fill: #2e9e77;
  font-weight: 700;
}

.say-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}

/* The real tap targets: invisible, thumb-sized, laid over the glyphs. */
.tap-disc {
  fill: transparent;
  cursor: pointer;
}

.tap-disc[data-done='true'] {
  fill: rgba(78, 205, 196, 0.18);
}

/* The next value breathes, so a child who has lost the thread can find it without a word. */
.tap-disc[data-next='true'] {
  stroke: #4ecdc4;
  stroke-width: 0.8;
  animation: tap-pulse 1.6s ease-in-out infinite;
}

@keyframes tap-pulse {
  0%, 100% { stroke-opacity: 0.25; }
  50% { stroke-opacity: 1; }
}

/* Sample times in the how-to panel: a setting, not a wrong answer, so not the base red button. */
.action-btn.say-btn {
  background-color: #eef1f6;
  color: #2d3561;
  box-shadow: none;
}

.action-btn.say-btn:hover {
  background-color: #dfe4ee;
  transform: none;
}

/* iOS will happily claim a drag as a page scroll; the dial owns the gesture while a hand is held. */
.set-frame svg {
  touch-action: none;
  cursor: grab;
}

/* two clocks to choose between: side by side, each at least a finger wide */
.choice-dials {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  margin: 10px 0;
}

.choice-dial {
  flex: 1 1 0;
  max-width: 46%;
  min-width: 140px;
  padding: 8px;
  border: 3px solid #1f2937;
  border-radius: 16px;
  background: #fff;
  cursor: pointer;
}

.choice-dial svg {
  width: 100%;
  height: auto;
  display: block;
}

.choice-dial:hover,
.choice-dial:focus-visible {
  background: #fff3a3;
  outline: 3px solid #ff6b6b;
  outline-offset: 2px;
}

/* building a face: the dial above, the loose numerals below, both thumb-sized */
.build {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin: 10px 0;
}

.build-dial {
  width: min(100%, 320px);
  height: auto;
  touch-action: none;
  background: #fffdf5;
  border-radius: 50%;
}

.build-tray {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  max-width: 420px;
}

.build-numeral {
  min-width: 56px;
  min-height: 56px;
  font-size: 22px;
  font-weight: 600;
  color: #1f2937;
  background: #fff;
  border: 3px solid #1f2937;
  border-radius: 14px;
  cursor: grab;
  touch-action: none;
}

.build-numeral[data-selected='true'] {
  background: #fff3a3;
  outline: 3px solid #ff6b6b;
  outline-offset: 2px;
}

.build-hint {
  margin: 0;
  font-size: 13px;
  color: #6b7280;
}

/* what comes next: two big numerals to pick between */
.choice-numbers {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin: 10px 0;
}

.choice-number {
  min-width: 96px;
  min-height: 96px;
  font-size: 40px;
  font-weight: 700;
  color: #1f2937;
  background: #fff;
  border: 4px solid #1f2937;
  border-radius: 20px;
  cursor: pointer;
}

.choice-number:hover,
.choice-number:focus-visible {
  background: #fff3a3;
  outline: 3px solid #ff6b6b;
  outline-offset: 2px;
}

/* the hour the question starts from */
.from-numeral {
  fill: #b91c1c;
  font-weight: 700;
}

/* the language segments were 38 px wide on a phone: narrower than a thumb */
.operator-toggle button {
  min-width: 44px;
  min-height: 44px;
}

/* artefact preview only: this file is generated by the test suite, not shipped */
body { display: flex; align-items: flex-start; justify-content: center; }
</style>
