name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # full history: the test-first gate reads the commit graph, and a shallow clone would make
      # it silently pass by seeing no commits at all
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # node 22 is deliberate: it is what the build host runs, so CI matches the machine that
      # produces the artefact rather than the newest thing that happens to work.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # coverage thresholds are enforced by vitest.config.ts: any figure below 90% fails the run
      - run: npm run test:coverage
      # the content gate: the eight integrity rules over the committed level set
      - run: npm run validate:levels
      # the process gate: tests precede the code they cover, checked against the commit graph
      - run: npm run gate:tests-first
