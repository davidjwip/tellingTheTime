name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # full history: the test-first gate reads the commit graph, and a shallow clone would make
      # it silently pass by seeing no commits at all
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # node 22 is deliberate: it is what the build host runs, so CI matches the machine that
      # produces the artefact rather than the newest thing that happens to work.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # the hook checks itself: executable, and valid POSIX shell
      - run: test -x .githooks/pre-push && sh -n .githooks/pre-push
      # ONE list of checks, shared with .githooks/pre-push through `npm run verify`, so the two
      # cannot drift the first time somebody adds a check to one of them
      - run: npm run verify

  # The real-browser specs. Separate job on purpose: they need a browser download, they test the
  # BUILT bundle rather than the sources, and a failure here means something the fake DOM cannot see
  # (pointer capture, touch-action, an origin the app should not be talking to).
  browser:
    runs-on: ubuntu-latest
    # Playwright's own image, with the browser already in it. `playwright install --with-deps`
    # took over ten minutes on a runner and hung in apt; the image has it built for CI.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
